<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="棋牌大厅">
<title>棋牌大厅</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: dark; --bg: #0b3d2b; --bg2: #072a1e; --card: rgba(255, 255, 255, .08); --line: rgba(255, 255, 255, .16); --gold: #ffd36b; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg2); color: #fff;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
body { background: radial-gradient(120% 70% at 50% 0%, #14644a 0%, var(--bg) 45%, var(--bg2) 100%) fixed; }
#wrap { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 24px); }
h1 { margin: 6px 0 2px; font-size: 30px; letter-spacing: .12em; text-align: center; }
.sub { margin: 0 0 20px; text-align: center; color: #b5d8c8; font-size: 13px; }
.group { margin: 18px 4px 8px; font-size: 13px; color: var(--gold); letter-spacing: .1em; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
a.game { display: flex; flex-direction: column; gap: 6px; padding: 16px 14px 14px; border-radius: 18px; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); min-height: 168px; position: relative; overflow: hidden; }
a.game:active { transform: scale(.97); background: rgba(255, 255, 255, .14); }
.badge { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; font-weight: 900; margin-bottom: 4px;
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
.b1 { background: linear-gradient(#ffcf5c, #f08a00); color: #5b2f00; }
.b2 { background: linear-gradient(#ff8a8a, #d63b3b); color: #fff; }
.b3 { background: linear-gradient(#fbf6e6, #e1d7b9); color: #b3261e; }
.b4 { background: linear-gradient(#fbf6e6, #e1d7b9); color: #1b7a3a; }
.name { font-size: 19px; font-weight: 800; }
.desc { font-size: 12px; line-height: 1.5; color: #c4e2d4; }
.stat { margin-top: auto; font-size: 12px; color: var(--gold); min-height: 16px; }
.foot { margin-top: 26px; text-align: center; font-size: 12px; color: #86b3a1; line-height: 1.8; }
.foot a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>
<div id="wrap">
  <h1>棋牌大厅</h1>
  <p class="sub">全部单机，你对电脑，进度保存在本机</p>

  <div class="group">扑克</div>
  <div class="grid">
    <a class="game" href="ddz.html">
      <span class="badge b1">♠</span>
      <span class="name">斗地主</span>
      <span class="desc">叫分抢地主，三档电脑水平（含推演 AI）</span>
      <span class="stat" id="st-ddz"></span>
    </a>
    <a class="game" href="poker.html">
      <span class="badge b2">♦</span>
      <span class="name">德州扑克</span>
      <span class="desc">无限注，4 位电脑牌友，智能提示与音效</span>
      <span class="stat" id="st-poker"></span>
    </a>
  </div>

  <div class="group">麻将</div>
  <div class="grid">
    <a class="game" href="mahjong.html">
      <span class="badge b3">中</span>
      <span class="name">国标麻将</span>
      <span class="desc">144 张、81 番种、起和 8 番，标准竞赛规则</span>
      <span class="stat" id="st-mj"></span>
    </a>
    <a class="game" href="sichuan.html">
      <span class="badge b4">万</span>
      <span class="name">四川麻将</span>
      <span class="desc">血战到底：定缺、碰杠胡，胡了继续打</span>
      <span class="stat" id="st-sc"></span>
    </a>
  </div>

  <div class="foot" id="foot">
    手机浏览器里可「添加到主屏幕」当 app 用<br>
    <a id="apk" href="https://github.com/suofengying981-lang/card_game/releases/download/apk-latest/qipai.apk">下载安卓版 APK</a>
  </div>
</div>
<script>
(function () {
  'use strict';
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const sign = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  const set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t || ''; };

  const d = read('ddz-stats-v1');
  if (d && d.games) set('st-ddz', '积分 ' + d.score + ' · ' + d.games + ' 局');
  const p = read('ddz-poker-v1');
  if (p && p.hands) set('st-poker', '盈亏 ' + sign(p.stack - 2000 * (p.buyins || 1)) + ' · ' + p.hands + ' 手');
  const s = read('mj-sc-v1');
  if (s && s.tot) set('st-sc', '累计 ' + sign(s.tot[0] || 0) + ' · ' + Math.max(0, (s.round || 1) - 1) + ' 局');
  set('st-mj', '');

  // 在安卓 app 里不再显示下载链接
  if (window.Capacitor) document.getElementById('foot').style.display = 'none';
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
